
name: Build pipSmart Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --package-lock=false

      - name: Install AdMob
        run: npm install @capacitor-community/admob@7 --package-lock=false

      - name: Check source files
        run: |
          pwd
          ls -la
          ls -la src

      - name: Build website
        run: npm run build -- --base=./

      - name: Configure Android
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.pipsmart.app',
            appName: 'pipSmart',
            webDir: 'dist'
          };
          export default config;
          EOF

          npx cap add android
          npx cap sync android

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">pipSmart</string>
              <string name="title_activity_main">pipSmart</string>
              <string name="admob_app_id">ca-app-pub-4483717100691601~1691493134</string>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          marker = "<application"
          start = s.find(marker)
          end = s.find(">", start)

          if start < 0 or end < 0:
              raise SystemExit("Could not find Android application tag")

          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s[:end+1] + '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="@string/admob_app_id" />
              ''' + s[end+1:]

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: pipSmart-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
